tx.fill()}function text(s,x,y,size,color='#17243b',align='left'){ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function heart(x,y,size=16){ctx.save();ctx.translate(x,y);ctx.scale(size/18,size/18);ctx.fillStyle='#ff547b';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-24,-3,-11,-17,0,-6);ctx.bezierCurveTo(11,-17,24,-3,0,10);ctx.fill();ctx.restore()}function drawHero(x,y){ctx.save();const air=!p.grounded,run=Math.sin(tick*.33);const bob=air?0:Math.abs(run)*3;ctx.translate(x+p.w/2,y+p.h/2-bob);if(inv>0&&tick%8<4)ctx.globalAlpha=.5;if(specialTimer>0){ctx.shadowColor='#ffe252';ctx.shadowBlur=28;}ctx.rotate(air?-.12:run*.045);ctx.scale(air?1.03:1+Math.abs(run)*.025,air?.93:1-Math.abs(run)*.035);if(heroImage.complete&&heroImage.naturalWidth){ctx.drawImage(heroImage,-33,-44,66,88);}else{round(-21,-31,42,61,12,'#233c68');round(-20,-44,40,37,17,'#ffd6b4');text('教',0,-18,24,'#212638','center')}ctx.restore()}

.active&&bossIntro){round(16,63,398,42,13,'#2b204acc');text('👑 ラスボス：踏みつけ or 教祖奥義！',215,90,18,'#fff0a0','center')}if(wiseUntil>tick&&!ended){ctx.save();ctx.setTransform(1,0,0,1,0,0);round(12,142,W-24,94,16,'#fff8dbef');text('🙏 教祖様のありがたいお言葉',W/2,171,16,'#8d5b16','center');let q=wiseWords[lastWise];ctx.font='bold 17px system-ui';let lines=[],line='';for(const ch of q){if(ctx.measureText(line+ch).width>W-60){lines.push(line);line=''}line+=ch}if(line)lines.push(line);lines.slice(0,2).forEach((l,i)=>text(l,W/2,197+i*23,17,'#233452','center'));ctx.restore()}if(ended){ctx.fillStyle='#10243bbd';R(0,0,W,H);round(20,245,390,230,24,'#fff9e7');text(won?'🎉 大田ケアに幸あれ！':'💦 あきらめないで！',215,332,26,'#193957','center');text(won?`ハート ${hearts} 個！ 教祖君ありがとう！`:'「最初から」で再チャレンジ！',215,382,16,'#2c5975','center')}}function frame(){update();draw();requestAnimationFrame(frame)}const map={Space:'jump',ArrowUp:'jump',KeyW:'jump'};window.addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>{keys={left:false,right:false,jump:false}});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});document.querySelector('#restart').onclick=()=>{unlockAudio();start()};
