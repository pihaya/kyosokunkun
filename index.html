ument.querySelector('#message').textContent='⚠️ ラスボス出現！踏みつけか奥義で倒そう！'}if(p.x>boss.x-600){boss.cool++;if(boss.cool>85){boss.cool=0;boss.shots.push({x:boss.x+20,y:GROUND-43,r:19});}for(const shot of boss.shots){shot.x-=5.3;if(Math.abs(shot.x-(p.x+p.w/2))<shot.r+14&&p.y+p.h>GROUND-73&&p.y<GROUND-15)hit()}boss.shots=boss.shots.filter(a=>a.x>p.x-200);if(boss.flash>0)boss.flash--;if(p.x+p.w>boss.x+15&&p.x<boss.x+boss.w-15&&p.y+p.h>boss.y+8&&p.y<boss.y+boss.h){if(p.vy>1&&oldBottom<boss.y+22){boss.hp=Math.max(0,boss.hp-1);boss.flash=15;p.vy=-11;sfx('stomp');charge=Math.min(100,charge+25);refreshCharge();if(boss.hp===0)defeatBoss()}else hit()}}}particles=particles.filter(a=>--a.life>0);if(p.x>themes[stage].length-125)next();refreshCharge();cam+=(Math.max(0,Math.min(themes[stage].length-W,p.x-115))-cam)*.12}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(s,x,y,size,color='#17243b',align='left'){ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function heart(x,y,size=16){ctx.save();ctx.translate(x,y);ctx.scale(size/18,size/18);ctx.fillStyle='#ff547b';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-24,-3,-11,-17,0,-6);ctx.bezierCurveTo(11,-17,24,-3,0,10);ctx.fill();ctx.restore()}function drawHero(x,y){ctx.save();const air=!p.grounded,run=Math.sin(tick*.33);const bob=air?0:Math.abs(run)*3;ctx.translate(x+p.w/2,y+p.h/2-bob);if(inv>0&&tick%8<4)ctx.globalAlpha=.5;if(specialTimer>0){ctx.shadowColor='#ffe252';ctx.shadowBlur=28;}ctx.rotate(air?-.12:run*.045);ctx.scale(air?1.03:1+Math.abs(run)*.025,air?.93:1-Math.abs(run)*.035);if(heroImage.complete&&heroImage.naturalWidth){ctx.drawImage(heroImage,-33,-44,66,88);}else{round(-21,-31,42,61,12,'#233c68');round(-20,-44,40,37,17,'#ffd6b4');text('教',0,-18,24,'#212638','center')}ctx.restore()}
function drawBoss(){if(!boss||!boss.active)return;ctx.save();ctx.translate(boss.x+boss.w/2,boss.y+boss.h/2);let wobble=Math.sin(tick*.11)*5;ctx.rotate(wobble*.003);ctx.fillStyle=boss.flash>0?'#fff4aa':'#3e365d';ctx.strokeStyle='#ff7789';ctx.lineWidth=7;ctx.beginPath();ctx.roundRect(-64,-75,128,150,26);ctx.fill();ctx.stroke();ctx.fillStyle='#ffdbf1';ctx.beginPath();ctx.arc(-25,-22,12,0,7);ctx.arc(25,-22,12,0,7);ctx.fill();ctx.fillStyle='#251a3d';ctx.beginPath();ctx.arc(-25,-22,5,0,7);ctx.arc(25,-22,5,0,7);ctx.fill();text('混乱',0,30,32,'#ffde72','center');text('の権化',0,54,18,'white','center');ctx.restore();round(boss.x-6,boss.y-39,140,18,7,'#261e36');round(boss.x-3,boss.y-36,134*boss.hp/boss.maxHp,12,5,'#ff5c82');text('👑 ラスボス',boss.x+boss.w/2,boss.y-50,18,'white','center');for(const shot of boss.shots){ctx.fillStyle='#bd76e8';ctx.beginPath();ctx.arc(shot.x,shot.y,shot.r,0,7);ctx.fill();text('💢',shot.x,shot.y+9,22,'white','center')}}
function draw(){let t=themes[stage];ctx.fillStyle=t.sky;R(0,0,W,H);ctx.fillStyle='#fff6ce';ctx.beginPath();ctx.arc(345,110,38,0,7);ctx.fill();for(let i=0;i<10;i++){let x=((i*275-cam*.18)%(W+340)+(W+340))%(W+340)-120;ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.ellipse(x,90+(i%3)*40,55,17,0,0,7);ctx.fill()}for(let i=0;i<20;i++){let x=i*190-cam*.33;ctx.fillStyle=t.hill;ctx.beginPath();ctx.ellipse(x,GROUND+15,150,145+(i%3)*25,0,Math.PI,0);ctx.fill()}ctx.fillStyle=t.ground;R(0,GROUND,W,H-GROUND);ctx.fillStyle='#426c4c';R(0,GROUND,W,10);ctx.save();ctx.translate(-cam,0);for(let x=80;x<t.length;x+=245){if(stage===0){round(x,GROUND-95,20,95,4,'#765038');ctx.fillStyle='#2f985c';ctx.beginPath();ctx.arc(x+10,GROUND-105,43,0,7);ctx.fill()}else if(stage===1){round(x,GROUND-65,70,65,4,'#d2b68a');text('書類',x+12,GROUND-32,19)}else{round(x,GROUND-145,95,145,3,'#637487');for(let a=0;a<3;a++)for(let b=0;b<2;b++)round(x+10+b*42,GROUND-128+a*35,24,20,2,'#c5d6e5')}}for(let pl of platforms){round(pl.x,pl.y,pl.w,pl.h,5,stage===1?'#987755':'#8c6645');round(pl.x,pl.y,pl.w,6,3,'#d9bb76')}for(let it of items)if(!it.got){heart(it.x,it.y+Math.sin(tick*.09+it.x)*5,19)}for(let e of enemies)if(e.alive){round(e.x,e.y,e.w,e.h,12,stage===0?'#9a6cbb':stage===1?'#bb785c':'#596277');text(stage===0?'不安':stage===1?'書類':'孤独',e.x+e.w/2,e.y+24,13,'white','center');ctx.fillStyle='white';R(e.x+9,e.y+8,6,5);R(e.x+27,e.y+8,6,5)}round(t.length-105,GROUND-174,12,174,2,'#f3e9d0');round(t.length-93,GROUND-174,100,60,4,'#f9d361');text('大田ケア',t.length-85,GROUND-142,18);text('GOAL!',t.length-85,GROUND-119,16);drawBoss();if(specialTimer>0){ctx.save();ctx.globalAlpha=.3+Math.sin(tick*.3)*.1;ctx.fillStyle="#ffe86b";ctx.beginPath();ctx.arc(p.x+21,p.y+30,85+Math.sin(tick*.2)*18,0,Math.PI*2);ctx.fill();ctx.restore();text("✨ 大田ケアに幸あれ！",p.x-45,p.y-24,18,"#fff5a0")}drawHero(p.x,p.y);for(let a of particles)text('✨',a.x,a.y-(35-a.life),24);ctx.restore();round(10,12,240,42,15,'#ffffffdd');text(`🌱 ${t.name}`,22,39,20);if(boss&&boss.active&&bossIntro){round(16,63,398,42,13,'#2b204acc');text('👑 ラスボス：踏みつけ or 教祖奥義！',215,90,18,'#fff0a0','center')}if(ended){ctx.fillStyle='#10243bbd';R(0,0,W,H);round(20,245,390,230,24,'#fff9e7');text(won?'🎉 大田ケアに幸あれ！':'💦 あきらめないで！',215,332,26,'#193957','center');text(won?`ハート ${hearts} 個！ 教祖君ありがとう！`:'「最初から」で再チャレンジ！',215,382,16,'#2c5975','center')}}function frame(){update();draw();requestAnimationFrame(frame)}const map={Space:'jump',ArrowUp:'jump',KeyW:'jump'};window.addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>{keys={left:false,right:false,jump:false}});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});document.querySelector('#restart').onclick=()=>{unlockAudio();start()};
document.querySelector('#special').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useSpecial()});const soundButton=document.querySelector('#sound');soundButton.onclick=()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'🔊 音ON':'🔇 音OFF';if(soundOn){unlockAudio();sfx('heart')}};
c.addEventListener('pointerdown',e=>{e.preventDefault();requestJump()},{passive:false});
