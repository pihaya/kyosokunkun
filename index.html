<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>スーパー教祖君 〜大田ケアを救え！〜</title><style>*{box-sizing:border-box}body{margin:0;background:#10233a;color:white;font-family:system-ui,'Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}.wrap{width:min(100vw,1040px);padding:10px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:clamp(17px,3vw,27px);margin:5px 0 10px}.pill{background:#ffcb54;color:#1d2a3b;border:0;border-radius:25px;padding:9px 15px;font-weight:bold;cursor:pointer}canvas{display:block;width:100%;aspect-ratio:16/9;background:#9adfff;border:4px solid #f6d879;border-radius:14px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-weight:800;margin:8px 2px;font-size:14px}.controls{display:flex;justify-content:space-between;gap:15px;margin-top:8px;touch-action:none}.group{display:flex;gap:9px}.ctrl{width:72px;height:65px;border:2px solid #a3c9e5;background:#294b73;color:white;border-radius:17px;font-size:25px;font-weight:900;touch-action:none;user-select:none}.ctrl:active{background:#4f80ad}.hint{font-size:12px;color:#b8d1e7;text-align:center;margin:8px 0}#message{color:#ffdd82;font-weight:700}@media(min-width:800px){.controls{max-width:600px;margin:auto}.ctrl{height:52px}}</style></head><body><div class="wrap"><header><h1>🌟 スーパー教祖君 <small style="font-size:.55em">〜大田ケアを救え！〜</small></h1><button class="pill" id="restart">最初から</button></header><div class="hud"><span id="stage">ステージ 1 / 3</span><span id="hearts">❤️ 0 / 0</span><span id="lives">💙💙💙</span><span id="message">希望を集めてゴールを目指そう！</span></div><canvas id="game" width="960" height="540" aria-label="教祖君の横スクロールアクションゲーム"></canvas><div class="controls"><div class="group"><button class="ctrl" data-key="left" aria-label="左へ">◀</button><button class="ctrl" data-key="right" aria-label="右へ">▶</button></div><div class="group"><button class="ctrl" data-key="jump" aria-label="ジャンプ">⤴</button><button class="ctrl" data-key="jump" aria-label="ジャンプ">JUMP</button></div></div><p class="hint">PC：← → または A D で移動、スペース / ↑ / W でジャンプ。敵は上から踏もう！ スマホ：画面下のボタンを使用。</p></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=960,H=540,GROUND=445;let stage=0,hearts=0,lives=3,cam=0,ended=false,won=false,inv=0,tick=0,keys={left:false,right:false,jump:false},jumpLatch=false;const themes=[{name:'希望の森',sky:'#8eddfc',hill:'#79bda3',ground:'#69b957',length:2900,goal:'訪問先へ！'},{name:'書類の谷',sky:'#b8d6f3',hill:'#8fa3be',ground:'#b2a66a',length:3300,goal:'事務所へ！'},{name:'無人のステーション',sky:'#8e9dbf',hill:'#687eaa',ground:'#678a75',length:3650,goal:'大田ケアを救え！'}];let p,platforms,enemies,items,particles=[];const R=(x,y,w,h)=>ctx.fillRect(x,y,w,h);function resetStage(){let t=themes[stage];p={x:70,y:GROUND-62,w:42,h:62,vx:0,vy:0,grounded:false};cam=0;inv=70;platforms=[];enemies=[];items=[];particles=[];for(let x=350;x<t.length-270;x+=330){let py=GROUND-95-(Math.floor(x/330)%2)*42;platforms.push({x,y:py,w:135,h:17});items.push({x:x+60,y:py-39,got:false});}for(let x=210;x<t.length-250;x+=190){items.push({x,y:GROUND-68-(x%3)*16,got:false})}for(let x=520;x<t.length-250;x+=370)enemies.push({x,y:GROUND-38,w:42,h:38,vx:stage===2?-1.45:-1.15,origin:x,alive:true});updateHud()}function updateHud(){document.querySelector('#stage').textContent=`ステージ ${stage+1} / 3：${themes[stage].name}`;document.querySelector('#hearts').textContent=`❤️ ${hearts} 個`;document.querySelector('#lives').textContent='💙'.repeat(Math.max(0,lives));}function start(){stage=0;hearts=0;lives=3;ended=false;won=false;resetStage();document.querySelector('#message').textContent='希望のハートを集めよう！'}function hit(){if(inv>0||ended)return;lives--;inv=95;updateHud();if(lives<=0){ended=true;won=false;document.querySelector('#message').textContent='ゲームオーバー！「最初から」で再挑戦';return}p.x=Math.max(60,p.x-150);p.y=GROUND-110;p.vy=-6;document.querySelector('#message').textContent='大丈夫、もう一度！'}function next(){if(stage===2){ended=true;won=true;document.querySelector('#message').textContent='大田ケアに幸あれ！ 全ステージクリア！';return}stage++;resetStage();document.querySelector('#message').textContent='次のステージへ！'}function update(){tick++;if(ended)return;if(inv>0)inv--;let dir=(keys.right?1:0)-(keys.left?1:0);p.vx=dir*4.5;if(keys.jump&&!jumpLatch&&p.grounded){p.vy=-13.5;p.grounded=false;jumpLatch=true}if(!keys.jump)jumpLatch=false;let oldBottom=p.y+p.h;p.x=Math.max(0,Math.min(themes[stage].length-p.w,p.x+p.vx));p.vy=Math.min(14,p.vy+.62);p.y+=p.vy;p.grounded=false;if(p.y+p.h>=GROUND){p.y=GROUND-p.h;p.vy=0;p.grounded=true}for(let pl of platforms){if(p.vy>=0&&oldBottom<=pl.y+5&&p.y+p.h>=pl.y&&p.x+p.w>pl.x+7&&p.x<pl.x+pl.w-7){p.y=pl.y-p.h;p.vy=0;p.grounded=true}}for(let e of enemies){if(!e.alive)continue;e.x+=e.vx;if(Math.abs(e.x-e.origin)>90)e.vx*=-1;if(p.x+p.w>e.x+7&&p.x<e.x+e.w-7&&p.y+p.h>e.y+5&&p.y<e.y+e.h){if(p.vy>1&&oldBottom<e.y+18){e.alive=false;p.vy=-9;hearts++;updateHud();document.querySelector('#message').textContent='ナイス！ ピンチを乗り越えた！'}else hit()}}for(let it of items){if(!it.got&&Math.abs(p.x+p.w/2-it.x)<31&&Math.abs(p.y+p.h/2-it.y)<43){it.got=true;hearts++;updateHud();particles.push({x:it.x,y:it.y,life:35});}}particles=particles.filter(a=>--a.life>0);if(p.x>themes[stage].length-125)next();cam+=(Math.max(0,Math.min(themes[stage].length-W,p.x-300))-cam)*.12}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(s,x,y,size,color='#17243b',align='left'){ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(s,x,y)}function heart(x,y,size=16){ctx.save();ctx.translate(x,y);ctx.scale(size/18,size/18);ctx.fillStyle='#ff547b';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-24,-3,-11,-17,0,-6);ctx.bezierCurveTo(11,-17,24,-3,0,10);ctx.fill();ctx.restore()}function drawHero(x,y){ctx.save();ctx.translate(x,y);if(inv>0&&tick%8<4)ctx.globalAlpha=.45;round(7,51,16,11,5,'#252e3c');round(26,51,17,11,5,'#252e3c');round(7,25,36,31,8,'#233c68');round(5,27,8,25,5,'#ffd0a9');round(38,27,8,25,5,'#ffd0a9');round(8,8,36,33,14,'#ffd6b4');ctx.fillStyle='#2b292b';ctx.beginPath();ctx.ellipse(25,10,22,14,0,Math.PI,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(9,17,8,15,-.2,Math.PI,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(41,14,7,15,.2,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#302c2b';ctx.lineWidth=2.7;ctx.beginPath();ctx.arc(18,25,4,Math.PI,Math.PI*2);ctx.arc(32,25,4,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#a84448';ctx.beginPath();ctx.ellipse(25,33,9,6,0,0,Math.PI);ctx.fill();ctx.strokeStyle='#afc6df';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(16,27);ctx.lineTo(25,37);ctx.lineTo(34,27);ctx.stroke();ctx.restore()}function draw(){let t=themes[stage];ctx.fillStyle=t.sky;R(0,0,W,H);ctx.fillStyle='#fff6ce';ctx.beginPath();ctx.arc(785,95,45,0,7);ctx.fill();for(let i=0;i<10;i++){let x=((i*275-cam*.18)%(W+340)+(W+340))%(W+340)-120;ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.ellipse(x,90+(i%3)*40,55,17,0,0,7);ctx.fill()}for(let i=0;i<20;i++){let x=i*190-cam*.33;ctx.fillStyle=t.hill;ctx.beginPath();ctx.ellipse(x,GROUND+15,150,145+(i%3)*25,0,Math.PI,0);ctx.fill()}ctx.fillStyle=t.ground;R(0,GROUND,W,H-GROUND);ctx.fillStyle='#426c4c';R(0,GROUND,W,10);ctx.save();ctx.translate(-cam,0);for(let x=80;x<t.length;x+=245){if(stage===0){round(x,GROUND-95,20,95,4,'#765038');ctx.fillStyle='#2f985c';ctx.beginPath();ctx.arc(x+10,GROUND-105,43,0,7);ctx.fill()}else if(stage===1){round(x,GROUND-65,70,65,4,'#d2b68a');text('書類',x+12,GROUND-32,19)}else{round(x,GROUND-145,95,145,3,'#637487');for(let a=0;a<3;a++)for(let b=0;b<2;b++)round(x+10+b*42,GROUND-128+a*35,24,20,2,'#c5d6e5')}}for(let pl of platforms){round(pl.x,pl.y,pl.w,pl.h,5,stage===1?'#987755':'#8c6645');round(pl.x,pl.y,pl.w,6,3,'#d9bb76')}for(let it of items)if(!it.got){heart(it.x,it.y+Math.sin(tick*.09+it.x)*5,19)}for(let e of enemies)if(e.alive){round(e.x,e.y,e.w,e.h,12,stage===0?'#9a6cbb':stage===1?'#bb785c':'#596277');text(stage===0?'不安':stage===1?'書類':'孤独',e.x+e.w/2,e.y+24,13,'white','center');ctx.fillStyle='white';R(e.x+9,e.y+8,6,5);R(e.x+27,e.y+8,6,5)}round(t.length-105,GROUND-174,12,174,2,'#f3e9d0');round(t.length-93,GROUND-174,100,60,4,'#f9d361');text('大田ケア',t.length-85,GROUND-142,18);text('GOAL!',t.length-85,GROUND-119,16);drawHero(p.x,p.y);for(let a of particles)text('✨',a.x,a.y-(35-a.life),24);ctx.restore();round(18,15,290,43,15,'#ffffffdd');text(`🌱 ${t.name}`,35,44,23);if(ended){ctx.fillStyle='#10243bbd';R(0,0,W,H);round(150,140,660,235,25,'#fff9e7');text(won?'🎉 大田ケアに幸あれ！':'💦 あきらめないで！',480,235,38,'#193957','center');text(won?`希望のハート ${hearts} 個！ 教祖君、ありがとう！`:'「最初から」で再チャレンジ！',480,296,23,'#2c5975','center')}}function frame(){update();draw();requestAnimationFrame(frame)}const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};window.addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>{keys={left:false,right:false,jump:false}});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});document.querySelector('#restart').onclick=start;start();frame()})();
</script></body></html>
